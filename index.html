<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <h1>Rock Paper Scissors</h1>
        <p>Can you win 5 rounds?</p>
        <div>
            <h2>Select your choice</h2>
            <div class="wrapper">
                <button data-value="rock">🪨</button>
                <button data-value="paper">📃</button>
                <button data-value="scissors">✂️</button>
            </div>
        </div>

        <div class="selection-wrapper">
            <div>
                <h3>You</h3>
                <div class="selection" id="selection-user"></div>
            </div>
            <div>
                <h3>Computer</h3>
                <div class="selection" id="selection-computer"></div>
            </div>
        </div>

        <p id="message" class="message"></p>

        <div>
            <h2>Score</h2>
            <div class="score-wrapper">
                <div>
                    <h3>You</h3>
                    <p class="score-user"></p>
                </div>
                <div>
                    <h3>Computer</h3>
                    <p class="score-computer"></p>
                </div>
                <div>
                    <h3>Ties</h3>
                    <p class="ties"></p>
                </div>
            </div>
        </div>

        <p id="result" class="message"></p>

        <button id="restart"><span>↻</span> Restart</button>
    </main>

    <script src="script.js" type="text/javascript"></script>
</body>

</html>
